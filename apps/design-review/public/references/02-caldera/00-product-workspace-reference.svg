<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Современное рабочее пространство сделки</title>
  <desc id="desc">Светлая продуктовая система с компактными карточками, тонкими границами и синими активными состояниями.</desc>
  <rect width="1200" height="760" fill="#f7f7f8"/>
  <rect x="54" y="48" width="1092" height="664" rx="32" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Inter, Arial, sans-serif" fill="#18181b">
    <text x="94" y="100" font-size="18" font-weight="700">МАКС-КОНТРАКТ</text>
    <text x="1014" y="100" font-size="14" fill="#71717a">СИСТЕМА 02</text>
    <line x1="94" y1="128" x2="1106" y2="128" stroke="#e4e4e7"/>

    <text x="94" y="196" font-size="48" font-weight="650" letter-spacing="-2">Рабочее пространство сделки</text>
    <text x="94" y="231" font-size="18" fill="#71717a">Точное состояние документов, сторон и следующих действий.</text>

    <rect x="94" y="278" width="458" height="178" rx="18" fill="#fff" stroke="#e4e4e7"/>
