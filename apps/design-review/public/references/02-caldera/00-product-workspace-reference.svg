    <text x="94" y="516" font-size="14" font-weight="700" fill="#3f3f46">БЫСТРЫЕ ДЕЙСТВИЯ</text>
    <rect x="94" y="542" width="248" height="104" rx="16" fill="#fff" stroke="#e4e4e7"/>
