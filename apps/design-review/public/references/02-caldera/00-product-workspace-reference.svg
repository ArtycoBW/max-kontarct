    <text x="120" y="391" font-size="76" font-weight="650" letter-spacing="-5">3</text>
    <text x="208" y="357" font-size="20" font-weight="700">Активные сделки</text>
    <text x="208" y="385" font-size="15" fill="#71717a">Все этапы идут по плану</text>
    <rect x="120" y="409" width="132" height="28" rx="14" fill="#eaf8f2"/>
    <text x="138" y="428" font-size="12" font-weight="600" fill="#137a53">2 на проверке</text>
    <rect x="262" y="409" width="122" height="28" rx="14" fill="#f1edff"/>
    <text x="280" y="428" font-size="12" font-weight="600" fill="#6847b7">1 на подписи</text>

    <rect x="576" y="278" width="530" height="178" rx="18" fill="#f6f9ff" stroke="#dbeafe"/>
