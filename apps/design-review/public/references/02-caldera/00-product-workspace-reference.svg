    <text x="674" y="351" font-size="19" font-weight="700">Структура готова к проверке</text>
    <line x1="604" y1="377" x2="1078" y2="377" stroke="#e4e4e7"/>
    <circle cx="616" cy="408" r="5" fill="#169b68"/>
