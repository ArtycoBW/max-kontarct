name: max-contract

x-api: &api
  image: max-contract-api:${RELEASE_TAG:-local}
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile.api
    target: runtime
  env_file: ${APP_ENV_FILE:-/etc/max-contract/max-contract.env}
  environment:
    NODE_ENV: production
    API_PORT: 3001
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      target: migrate
    image: max-contract-migrate:${RELEASE_TAG:-local}
    env_file: ${APP_ENV_FILE:-/etc/max-contract/max-contract.env}
    profiles: [tools]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    <<: *api
  worker:
    <<: *api
    command: [node, apps/api/dist/worker.js]
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: 3002
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
  web:
    image: max-contract-web:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    environment:
      API_INTERNAL_BASE_URL: http://api:3001/api/v1
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777", "/app/apps/web/.next/cache:size=64m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    volumes: ["./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
