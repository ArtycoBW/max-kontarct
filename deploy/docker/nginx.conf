limit_req_zone $binary_remote_addr zone=api:10m rate=180r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
# Do not log query strings, invitation fragments, cookies or request bodies.
log_format private_access '$time_iso8601 $request_method $uri $status $body_bytes_sent';
access_log /dev/stdout private_access;
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 21m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
