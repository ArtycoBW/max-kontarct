limit_req_zone $binary_remote_addr zone=max_contract_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=max_contract_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name max-kontrakt.ru www.max-kontrakt.ru;
    return 301 https://www.max-kontrakt.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name max-kontrakt.ru;

    ssl_certificate /etc/letsencrypt/live/max-kontrakt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-kontrakt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://www.max-kontrakt.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.max-kontrakt.ru;

    ssl_certificate /etc/letsencrypt/live/max-kontrakt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-kontrakt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Legacy public webhook URL retained for the existing MAX bot subscription.
    location = /api/max-bot/webhook {
        limit_req zone=max_contract_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001/api/v1/max-bot/webhook;
        include proxy_params;
    }

    location /api/v1/auth/ {
        limit_req zone=max_contract_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
    }

    location = /api/v1/onboarding/max-contact {
        limit_req zone=max_contract_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
    }

    location /api/ {
        limit_req zone=max_contract_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include proxy_params;
        proxy_cache_bypass $http_upgrade;
    }
}
